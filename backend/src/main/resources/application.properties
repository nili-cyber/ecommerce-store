spring.application.name=ecommerce

# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----- Server -----
server.port=8080

# ----- JWT -----
# 256-bit+ secret, replace in production and load from an env var / secrets manager instead
jwt.secret=ChangeThisToAStrongRandomSecretKeyThatIsAtLeast256BitsLong123456
jwt.expiration-ms=86400000

# ----- CORS -----
app.cors.allowed-origin=http://localhost:3000

# ----- Stripe -----
# Get these from https://dashboard.stripe.com/test/apikeys and
# https://dashboard.stripe.com/test/webhooks — never commit real keys.
stripe.secret-key=sk_test_REPLACE_ME
stripe.webhook-secret=whsec_REPLACE_ME

# ----- PayPal -----
# Get these from https://developer.paypal.com/dashboard/applications (create
# a Sandbox app for testing). Switch base-url to https://api-m.paypal.com
# only once you move to a Live app's credentials.
paypal.client-id=REPLACE_ME_PAYPAL_CLIENT_ID
paypal.client-secret=REPLACE_ME_PAYPAL_CLIENT_SECRET
paypal.base-url=https://api-m.sandbox.paypal.com

# Where Stripe redirects the browser back to after checkout
app.frontend-url=http://localhost:3000
